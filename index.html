<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI转型">
  <title>AI转型</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 顶栏（原生 APP 风格标题栏） -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <button class="top-btn menu-btn" id="menuBtn" aria-label="目录">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="brand">
            <span class="brand-logo">⚡</span>
            <span class="brand-name">AI转型</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="top-btn" id="searchToggleBtn" aria-label="搜索">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
        </div>
      </div>
      <!-- 搜索栏（展开/收起） -->
      <div class="searchbar" id="searchbar" hidden>
        <input type="search" id="search" placeholder="搜索知识点 / 面试题…" autocomplete="off">
        <button class="searchbar-close" id="searchClose">取消</button>
      </div>
      <!-- 模块 tab（仅在知识/面试视图显示） -->
      <div class="view-tabs" id="viewTabs">
        <button class="vtab active" data-tab="knowledge">📚 知识复习</button>
        <button class="vtab" data-tab="interview">🎯 刷面试题</button>
      </div>
    </header>

    <!-- 主内容区（4 个视图） -->
    <main class="views" id="views">

      <!-- 视图1：知识/面试 共用（列表+详情） -->
      <section class="view active" id="view-main">
        <div class="layout">
          <!-- 侧栏（模块章节树） -->
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
              <div class="side-actions">
                <button class="ghost-btn" id="favFilter">★ 只看收藏</button>
                <span class="count-hint" id="countHint"></span>
              </div>
            </div>
            <nav class="tree" id="tree"></nav>
            <div class="sidebar-foot">数据来自你的工作空间资料</div>
          </aside>

          <!-- 内容区 -->
          <div class="content" id="content">
            <div class="welcome" id="welcome">
              <div class="welcome-card">
                <h2>开始你的 AI 面试冲刺 🚀</h2>
                <p>从左侧选择<b>模块</b>与<b>知识点</b>开始复习。</p>
                <ul class="welcome-list">
                  <li>📚 <b>知识复习</b>：系统学大模型 / Agent 知识</li>
                  <li>🎯 <b>刷面试题</b>：先自测再揭答案</li>
                  <li>🎲 <b>随机抽题</b>：模拟面试快速刷</li>
                  <li>⭐ <b>收藏</b>：星标重点，随时回看</li>
                </ul>
                <p class="welcome-tip">底部导航栏可切换功能。点右上角 🔍 搜索。</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 上一篇/下一篇 -->
        <nav class="pager" id="pager" hidden>
          <button class="pg-btn" id="prevBtn" aria-label="上一篇">‹ 上一篇</button>
          <span class="pg-pos" id="pgPos">0 / 0</span>
          <button class="pg-btn" id="nextBtn" aria-label="下一篇">下一篇 ›</button>
        </nav>
      </section>

      <!-- 视图2：随机抽题 -->
      <section class="view" id="view-quiz">
        <div class="quiz-container" id="quizContainer">
          <div class="quiz-start" id="quizStart">
            <div class="quiz-start-card">
              <div class="quiz-icon">🎲</div>
              <h2>随机抽题</h2>
              <p>从全部 <b id="quizTotalCount">0</b> 道面试题中随机抽取 10 道，模拟面试快速自测。</p>
              <button class="quiz-start-btn" id="quizStartBtn">开始抽题</button>
            </div>
          </div>

          <div class="quiz-active" id="quizActive" hidden>
            <div class="quiz-header">
              <span class="quiz-progress" id="quizProgress">1 / 10</span>
              <span class="quiz-score" id="quizScore">✓ 0</span>
              <button class="quiz-quit" id="quizQuitBtn">退出</button>
            </div>
            <div class="quiz-card" id="quizCard">
              <div class="quiz-q-module" id="quizQModule"></div>
              <div class="quiz-q-title" id="quizQTitle"></div>
              <div class="quiz-question" id="quizQuestion"></div>
              <div class="quiz-reveal-zone" id="quizRevealZone">
                <button class="quiz-reveal-btn" id="quizRevealBtn">👀 查看答案</button>
              </div>
              <div class="quiz-answer" id="quizAnswer" hidden>
                <div class="quiz-ans-label">💡 参考答案</div>
                <div class="quiz-ans-body md" id="quizAnsBody"></div>
                <div class="quiz-ans-toggle">
                  <div class="ans-mode-tabs" id="quizModeTabs">
                    <button class="ans-mode-btn" data-mode="concise">精简</button>
                    <button class="ans-mode-btn" data-mode="full">详细</button>
                  </div>
                </div>
                <div class="quiz-tips" id="quizTips" hidden></div>
              </div>
              <div class="quiz-actions" id="quizActions" hidden>
                <button class="quiz-btn wrong" id="quizWrongBtn">✗ 没答好</button>
                <button class="quiz-btn correct" id="quizCorrectBtn">✓ 答对了</button>
              </div>
            </div>
          </div>

          <div class="quiz-result" id="quizResult" hidden>
            <div class="quiz-result-card">
              <div class="quiz-result-icon" id="quizResultIcon">🎯</div>
              <h2 id="quizResultTitle">完成！</h2>
              <div class="quiz-result-score">
                <span class="big" id="quizResultScore">0</span>
                <span class="sub">/ 10</span>
              </div>
              <div class="quiz-result-msg" id="quizResultMsg"></div>
              <div class="quiz-result-actions">
                <button class="quiz-start-btn" id="quizRetryBtn">再抽一次</button>
                <button class="quiz-back-btn" id="quizBackBtn">返回</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 视图3：收藏 -->
      <section class="view" id="view-favs">
        <div class="favs-container" id="favsContainer">
          <div class="favs-list" id="favsList"></div>
        </div>
      </section>
    </main>

    <!-- 底部导航栏（原生 APP 风格） -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="bnav-item active" data-view="main">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span>学习</span>
      </button>
      <button class="bnav-item" data-view="quiz">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>抽题</span>
      </button>
      <button class="bnav-item" data-view="favs">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>收藏</span>
      </button>
    </nav>

    <div class="scrim" id="scrim"></div>

    <!-- 笔记抽屉 -->
    <div class="notes-mask" id="notesMask"></div>
    <div class="notes-panel" id="notesPanel">
      <div class="notes-head">
        <span>📝 学习笔记</span>
        <button class="icon-btn" id="notesClose" aria-label="关闭">✕</button>
      </div>
      <div class="notes-ctx" id="notesCtx"></div>
      <textarea id="notesArea" placeholder="写下你的理解、易错点、口诀…（自动保存到本机）"></textarea>
      <div class="notes-foot">
        <span class="notes-saved" id="notesSaved"></span>
        <button class="primary-btn" id="notesSave">保存</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
